api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "Header trust strip"
handle = "trust-strip"
uid = "b1434acc-a286-46b8-81e5-35aa85ba670f"

  [[extensions.targeting]]
  target = "purchase.checkout.header.render-after"
  module = "./src/TrustStrip.tsx"

  [extensions.settings]

    [[extensions.settings.fields]]
    key = "icon_lock_url"
    type = "single_line_text_field"
    name = "Lock icon URL (optional)"
    description = "Only needed if the orange icons don't appear. Upload assets/lock.svg to Shopify Files and paste its URL here."

    [[extensions.settings.fields]]
    key = "icon_truck_url"
    type = "single_line_text_field"
    name = "Truck icon URL (optional)"
    description = "Only needed if the orange icons don't appear. Upload assets/truck.svg to Shopify Files and paste its URL here."

    [[extensions.settings.fields]]
    key = "icon_return_url"
    type = "single_line_text_field"
    name = "Return icon URL (optional)"
    description = "Only needed if the orange icons don't appear. Upload assets/return.svg to Shopify Files and paste its URL here."
